info:
  name: "Points: too large"
  type: http
  seq: 2

http:
  method: GET
  url: "{{SERVER_URL}}/points?SouthWest.Latitude=44.8&SouthWest.Longitude=5.4&NorthEast.Latitude=45&NorthEast.Longitude=5.6"
  params:
    - name: SouthWest.Latitude
      value: "44.8"
      type: query
    - name: SouthWest.Longitude
      value: "5.4"
      type: query
    - name: NorthEast.Latitude
      value: "45"
      type: query
    - name: NorthEast.Longitude
      value: "5.6"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
